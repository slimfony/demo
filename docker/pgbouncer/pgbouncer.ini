[databases]
demo = host=postgres port=5432 dbname=demo

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /secrets/pgbouncer_userlist.txt
; transaction pooling: a server connection is held only while a transaction runs
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 40
; prepared statements survive transaction pooling (PgBouncer 1.21+)
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
server_idle_timeout = 600
log_connections = 0
log_disconnections = 0
