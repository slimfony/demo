[databases]
demo = host=postgres port=5432 dbname=demo

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /secrets/pgbouncer_userlist.txt
; transaction pooling: a server connection is held only while a transaction runs
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 40
; Fail fast when the database is away: a request waits at most 3 s for a server connection (default 120 s), and a failed
; server login is tried again after 1 s (default 15 s: PgBouncer keeps answering with the cached error for that long).
query_wait_timeout = 3
server_login_retry = 1
; prepared statements survive transaction pooling (PgBouncer 1.21+)
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
server_idle_timeout = 600
log_connections = 0
log_disconnections = 0
