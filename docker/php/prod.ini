; Production PHP settings for the demo. Tuned for a long-lived FrankenPHP worker, not for development.

; --- no information leaks
expose_php = 0
display_errors = 0
display_startup_errors = 0
html_errors = 0
log_errors = 1
error_log = /dev/stderr
zend.exception_ignore_args = 1
assert.exception = 1

; --- limits
memory_limit = 256M
max_execution_time = 30
max_input_time = 10
post_max_size = 1M
upload_max_filesize = 1M
max_input_vars = 200

; --- opcache: the code never changes inside a running container
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.jit = tracing
opcache.jit_buffer_size = 64M
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- shared memory for the metrics (APCu is shared by all worker threads)
apc.enabled = 1
apc.shm_size = 64M

; --- the application is stateless: no PHP sessions
session.auto_start = 0

serialize_precision = -1
