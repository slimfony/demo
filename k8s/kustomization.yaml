apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: slimfony-demo
resources:
  - config.yaml
  - web.yaml
  - workers.yaml
  - idp.yaml
# Point the image at your registry:  kustomize edit set image slimfony-demo=registry.example.com/slimfony-demo:0.2.0
images:
  - name: slimfony-demo
    newName: slimfony-demo
    newTag: 0.2.0
